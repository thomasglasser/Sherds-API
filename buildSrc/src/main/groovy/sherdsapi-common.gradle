import dev.thomasglasser.sherdsapi.gradle.GeneratePackageInfos
import java.util.regex.Matcher
import java.util.regex.Pattern

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'dev.lukebemish.immaculate'
    id 'idea'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Parchment'
                url = 'https://maven.parchmentmc.org'
            }
        }
        filter { includeGroupAndSubgroups("org.parchmentmc") }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net/'
            }
        }
        filter { includeGroupAndSubgroups("net.fabricmc") }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Mod Menu'
                url = 'https://maven.terraformersmc.com/releases'
            }
        }
        filter {
            includeGroupAndSubgroups "com.terraformersmc"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroupAndSubgroups "maven.modrinth" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'JEI'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter { includeGroupAndSubgroups "mezz.jei" }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    maven {
        name = 'TommyLib'
        url = 'https://maven.thomasglasser.dev/releases/'
        content {
            includeGroupAndSubgroups("dev.thomasglasser.tommylib")
        }
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Mojang Meta'
        url = 'https://maven.neoforged.net/mojang-meta'
    }
    mavenCentral()
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            version: project.version,
            group: project.group,
            minecraft_version: minecraft_version,
            next_minecraft_version: next_minecraft_version,
            mod_name: mod_name,
            mod_author: mod_author,
            mod_id: mod_id,
            license: license,
            description: project.description,
            neoforge_version: neoforge_version,
            fabric_version: fabric_version,
            fabric_loader_version: fabric_loader_version,
            java_version: java_version,
            icon: icon,
            github_name: github_name,
            tommylib_version: tommylib_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
tasks.processResources.dependsOn generateModMetadata

compileJava.dependsOn immaculateApply
compileJava.finalizedBy immaculateCheck

immaculate {
    workflows.register('java') {
        files.from rootProject.fileTree("src/main/java", {
            include "**/*.java"
        })
        noTabs()
        googleFixImports()
        toggleOff = 'spotless:off'
        toggleOn = 'spotless:on'
        eclipse {
            version '3.37.0'
            config = rootProject.file('codeformat/formatter-config.xml')
        }

        custom 'canonicalizeNullable', { String fileContents ->
            fileContents = fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
            fileContents = fileContents.replace('jakarta.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
            fileContents = fileContents.replace('edu.umd.cs.findbugs.annotations.Nullable', 'org.jetbrains.annotations.Nullable')
            fileContents = fileContents.replace('org.checkerframework.checker.nullness.qual.Nullable', 'org.jetbrains.annotations.Nullable')
            fileContents = fileContents.replace('android.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
            fileContents = fileContents.replace('com.google.errorprone.annotations.Nullable', 'org.jetbrains.annotations.Nullable')
            return fileContents
        }

        custom 'noWildcardImports', { String fileContents ->
            if (Pattern.compile('(?m)^\\s*import\\s+(?:static\\s+)?[^;\\r\\n]+\\*;').matcher(fileContents).find()) {
                throw new GradleException('No wildcard imports are allowed! Explicitly import each class.')
            }
        }

        custom 'noStaticImports', { String fileContents ->
            if (Pattern.compile('(?m)^\\s*import\\s+static\\s+').matcher(fileContents).find()) {
                throw new GradleException('Static imports are disallowed. Use class qualification (e.g. Collections.emptyList()).')
            }
        }

        custom 'noNotNull', { String fileContents ->
            if (fileContents.contains('@NotNull') || fileContents.contains('@Nonnull')) {
                throw new GradleException('@NotNull and @Nonnull are disallowed. Parameters and return types are non-null by default via package-info.java.')
            }
        }

        custom 'noVar', { String fileContents ->
            if (Pattern.compile('(?m)^\\s*(?:final\\s+)?var\\s+[a-zA-Z_$][a-zA-Z0-9_$]*\\s*=').matcher(fileContents).find()) {
                throw new GradleException("Do not use the 'var' keyword. Explicitly define variable types.")
            }
        }

        custom 'blankLinesBeforeMemberTypes', { String fileContents ->
            Pattern pattern = Pattern.compile('(?m)^([ \t]*\\}(?:[ \t]*//[^\\r\\n]*)?)\\r?\\n([ \t]*(?:(?:/\\*\\*(?:[\\s\\S]*?)\\*/|(?:///[^\\r\\n]*\\r?\\n[ \t]*)+)\\r?\\n[ \t]*)?(?:@[A-Za-z0-9_.]+(?:\\([^)]*\\))?\\s+)*(?:(?:public|protected|private|static|final|abstract|sealed|non-sealed)\\s+)*(?:class|interface|enum|record|@interface)\\s+[A-Za-z0-9_]+)')
            return pattern.matcher(fileContents).replaceAll('$1\n\n$2')
        }

        custom 'trimTrailingWhitespace', { String fileContents ->
            return fileContents.replaceAll('(?m)[ \t]+$', '')
        }

        custom 'endWithNewline', { String fileContents ->
            return fileContents.stripTrailing() + '\n'
        }
    }

    workflows.register('gradle') {
        files.from rootProject.fileTree(projectDir, {
            include '**/*.gradle'
            include '**/*.gradle.kts'
            exclude 'build/**', '.gradle/**', 'src/generated/**'
        })
        custom 'trimTrailingWhitespace', { String fileContents ->
            return fileContents.replaceAll('(?m)[ \t]+$', '')
        }
        custom 'endWithNewline', { String fileContents ->
            return fileContents.stripTrailing() + '\n'
        }
    }

    workflows.register('json') {
        files.from rootProject.fileTree("src/main/resources", {
            include "**/*.json"
        })
        custom 'trimTrailingWhitespace', { String fileContents ->
            return fileContents.replaceAll('(?m)[ \t]+$', '')
        }
        custom 'endWithNewline', { String fileContents ->
            return fileContents.stripTrailing() + '\n'
        }
    }
}

def generatePackageInfos = tasks.register('generatePackageInfos', GeneratePackageInfos) {
    srcDir.set(file('src/main/java'))
    outDir.set(layout.buildDirectory.dir("generated/sources/packageInfo/main/java"))
}

sourceSets.main.java.srcDir generatePackageInfos

idea {
    module {
        generatedSourceDirs += file('build/generated/sources/packageInfo/main/java')
    }
}

tasks.processResources.dependsOn generatePackageInfos


javadoc {
    failOnError = false
    options.tags = [ "apiNote", "reason" ]
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java

            pom {
                name = project.mod_name
                description = project.description
                url = "https://github.com/thomasglasser/${github_name}/wiki"
                licenses {
                    license {
                        name = project.license
                        url = project.license_url
                    }
                }
                developers {
                    developer {
                        id = project.mod_author
                        name = project.mod_author
                    }
                }
                issueManagement {
                    system = 'GitHub'
                    url = "https://github.com/thomasglasser/${github_name}/issues"
                }
                scm {
                    connection = "scm:git:git://github.com/thomasglasser/${github_name}.git"
                    developerConnection = "scm:git:ssh://github.com:thomasglasser/${github_name}.git"
                    url = "https://github.com/thomasglasser/${github_name}/tree/${minecraft_version}"
                }
            }
        }
    }

    repositories {
        maven {
            name = "Reposilite"
            url = "https://maven.thomasglasser.dev/releases"
            credentials {
                username = project.findProperty("REPOSILITE_USERNAME") ?: System.getenv("REPOSILITE_USERNAME")
                password = project.findProperty("REPOSILITE_PASSWORD") ?: System.getenv("REPOSILITE_PASSWORD")
            }
        }
    }
}

boolean isPublishToMavenLocal = gradle.startParameter.taskNames.any { it.contains('ToMavenLocal') }
if (!isPublishToMavenLocal) {
    signing {
        useGpgCmd()
        sign publishing.publications
    }
}
